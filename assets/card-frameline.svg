<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="Frameline — CLIENT WORK · FILM STUDIO">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0a0d16"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#ff7a7f" stop-opacity=".26"/><stop offset="1" stop-color="#ff7a7f" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="420" height="250" rx="20"/></clipPath>
</defs>
<style>
  .k { font: 600 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.4px; fill: #ff7a7f }
  .t { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f8fafc }
  .b { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9ca3af }
  .chip rect { fill: #ff7a7f; fill-opacity: .1; stroke: #ff7a7f; stroke-opacity: .38 }
  .chip text { font: 500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #fecaca }
  .iris { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  .ring { fill: #1a0f14; stroke: #ff7a7f; stroke-width: 2 }
  .hex { fill: #ff7a7f; fill-opacity: .16; stroke: #ff7a7f; stroke-opacity: .5 }
  .blade { fill: none; stroke: #ff7a7f; stroke-width: 1.8; stroke-linecap: round; opacity: .9 }
  .halo { fill: none; stroke: #ff7a7f; stroke-opacity: .28; transform-box: fill-box; transform-origin: center; animation: halo 3s ease-in-out infinite alternate }
  @keyframes halo { from { transform: scale(.94); opacity: .4 } to { transform: scale(1.06); opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<g clip-path="url(#clip)">
  <rect width="420" height="250" fill="url(#bg)"/>
  <rect width="420" height="250" fill="url(#glow)"/>
  <circle class="halo" cx="348" cy="62" r="44"/><g class="iris"><circle class="ring" cx="348" cy="62" r="36"/><polygon class="hex" points="360.1,69 348,76 335.9,69 335.9,55 348,48 360.1,55"/><path class="blade" d="M360.1 69L324.7 89.4M348 76L312.6 55.6M335.9 69L335.9 28.1M335.9 55L371.3 34.6M348 48L383.4 68.4M360.1 55L360.1 95.9"/></g>
  <g>
    <text x="30" y="50" class="k">CLIENT WORK · FILM STUDIO</text>
    <text x="29" y="92" class="t">Frameline</text>
    <text class="b"><tspan x="30" y="128">Site for a cinematic production house</tspan><tspan x="30" y="152">in Gaza — a Three.js scroll hero where</tspan><tspan x="30" y="176">twelve glass rods braid along a path.</tspan></text>
    <g class="chip"><rect x="30" y="196" width="87" height="26" rx="13"/><text x="73.5" y="213.5" text-anchor="middle">Three.js</text></g><g class="chip"><rect x="125" y="196" width="56" height="26" rx="13"/><text x="153" y="213.5" text-anchor="middle">GLSL</text></g><g class="chip"><rect x="189" y="196" width="64" height="26" rx="13"/><text x="221" y="213.5" text-anchor="middle">WebGL</text></g><g class="chip"><rect x="261" y="196" width="94" height="26" rx="13"/><text x="308" y="213.5" text-anchor="middle">Scroll FX</text></g>
  </g>
  
</g>
<rect x=".5" y=".5" width="419" height="249" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
