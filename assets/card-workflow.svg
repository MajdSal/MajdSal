<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Workflow — NOW BUILDING · AI LAYER">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0a0d16"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#a78bfa" stop-opacity=".26"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="840" height="250" rx="20"/></clipPath>
</defs>
<style>
  .k { font: 600 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.4px; fill: #a78bfa }
  .t { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f8fafc }
  .b { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9ca3af }
  .chip rect { fill: #a78bfa; fill-opacity: .1; stroke: #a78bfa; stroke-opacity: .38 }
  .chip text { font: 500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ddd6fe }
  .links path { fill: none; stroke: #334155; stroke-width: 1.6 }
  .flow path { fill: none; stroke: #22d3ee; stroke-width: 1.6; stroke-dasharray: 3 8; opacity: .9; animation: dash 1.1s linear infinite }
  @keyframes dash { to { stroke-dashoffset: -11 } }
  .node rect { fill: #0f172a; stroke: #ffffff; stroke-opacity: .14 }
  .node circle { fill: #22d3ee }
  .node text { font: 500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #cbd5e1 }
  .hot rect { fill: #1e1633; stroke: #a78bfa; stroke-opacity: .9 }
  .hot circle { fill: #a78bfa }
  .hot text { fill: #ede9fe }
  .ping { fill: none; stroke: #a78bfa; transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite }
  @keyframes ping { from { transform: scale(1); opacity: .7 } to { transform: scale(1.3, 1.6); opacity: 0 } }
  .hint { font: 500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #64748b }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<g clip-path="url(#clip)">
  <rect width="840" height="250" fill="url(#bg)"/>
  <rect width="840" height="250" fill="url(#glow)"/>
  
  <g class="links"><path id="l1" d="M550 125L590 125"/><path id="l2" d="M686 125C708 125 708 62 730 62"/><path id="l3" d="M686 125C708 125 708 188 730 188"/></g>
  <g class="flow"><path d="M550 125L590 125"/><path d="M686 125C708 125 708 62 730 62"/><path d="M686 125C708 125 708 188 730 188"/></g>
  <g class="node "><rect x="470" y="107" width="80" height="36" rx="10"/><circle cx="483" cy="125" r="3.2"/><text x="516" y="129.5" text-anchor="middle">webhook</text></g>
  <rect class="ping" x="590" y="103" width="96" height="44" rx="12"/>
  <g class="node hot"><rect x="590" y="103" width="96" height="44" rx="10"/><circle cx="603" cy="125" r="3.2"/><text x="644" y="129.5" text-anchor="middle">ai.agent</text></g>
  <g class="node "><rect x="730" y="44" width="80" height="36" rx="10"/><circle cx="743" cy="62" r="3.2"/><text x="776" y="66.5" text-anchor="middle">tasks</text></g>
  <g class="node "><rect x="730" y="170" width="80" height="36" rx="10"/><circle cx="743" cy="188" r="3.2"/><text x="776" y="192.5" text-anchor="middle">notify</text></g>
  <circle r="3.2" fill="#e0f2fe" opacity="0"><animateMotion dur="1.3s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#l1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="1.3s" begin="0s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#e0f2fe" opacity="0"><animateMotion dur="1.3s" begin=".65s" repeatCount="indefinite"><mpath xlink:href="#l2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="1.3s" begin=".65s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#e0f2fe" opacity="0"><animateMotion dur="1.3s" begin=".65s" repeatCount="indefinite"><mpath xlink:href="#l3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="1.3s" begin=".65s" repeatCount="indefinite"/></circle>
  <g>
    <text x="30" y="50" class="k">NOW BUILDING · AI LAYER</text>
    <text x="29" y="92" class="t">Workflow</text>
    <text class="b"><tspan x="30" y="128">The AI module of a SaaS platform for managing</tspan><tspan x="30" y="152">software companies — plus n8n flows that take</tspan><tspan x="30" y="176">over recurring project &amp; team-management work.</tspan></text>
    <g class="chip"><rect x="30" y="196" width="102" height="26" rx="13"/><text x="81" y="213.5" text-anchor="middle">AI modules</text></g><g class="chip"><rect x="140" y="196" width="49" height="26" rx="13"/><text x="164.5" y="213.5" text-anchor="middle">n8n</text></g><g class="chip"><rect x="197" y="196" width="72" height="26" rx="13"/><text x="233" y="213.5" text-anchor="middle">Python</text></g><g class="chip"><rect x="277" y="196" width="140" height="26" rx="13"/><text x="347" y="213.5" text-anchor="middle">EN / AR chatbot</text></g>
  </g>
  <text x="810" y="236" text-anchor="end" class="hint">workflow-chatbot ↗</text>
</g>
<rect x=".5" y=".5" width="839" height="249" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
