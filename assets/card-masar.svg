<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="Masar — ENTERPRISE · TEAM OF 6">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0a0d16"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="420" height="250" rx="20"/></clipPath>
  <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
</defs>
<style>
  .k { font: 600 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2.4px; fill: #22d3ee }
  .t { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; letter-spacing: -.6px; fill: #f8fafc }
  .b { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9ca3af }
  .chip rect { fill: #22d3ee; fill-opacity: .1; stroke: #22d3ee; stroke-opacity: .38 }
  .chip text { font: 500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #a5f3fc }
  .bar { fill: url(#barFill); transform-box: fill-box; transform-origin: 50% 100%; animation: grow 2.6s ease-in-out infinite alternate }
  @keyframes grow { from { transform: scaleY(.35) } to { transform: scaleY(1) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<g clip-path="url(#clip)">
  <rect width="420" height="250" fill="url(#bg)"/>
  <rect width="420" height="250" fill="url(#glow)"/>
  <line x1="296" y1="97" x2="392" y2="97" stroke="#334155" stroke-width="1.5"/><rect class="bar" x="300" y="74" width="8" height="22" rx="2" style="animation-delay:-0.00s"/><rect class="bar" x="313" y="60" width="8" height="36" rx="2" style="animation-delay:-0.37s"/><rect class="bar" x="326" y="68" width="8" height="28" rx="2" style="animation-delay:-0.74s"/><rect class="bar" x="339" y="48" width="8" height="48" rx="2" style="animation-delay:-1.11s"/><rect class="bar" x="352" y="62" width="8" height="34" rx="2" style="animation-delay:-1.48s"/><rect class="bar" x="365" y="38" width="8" height="58" rx="2" style="animation-delay:-1.85s"/><rect class="bar" x="378" y="52" width="8" height="44" rx="2" style="animation-delay:-2.22s"/>
  <g>
    <text x="30" y="50" class="k">ENTERPRISE · TEAM OF 6</text>
    <text x="29" y="92" class="t">Masar</text>
    <text class="b"><tspan x="30" y="128">Python &amp; AI side of an enterprise</tspan><tspan x="30" y="152">management platform, built in a team</tspan><tspan x="30" y="176">of six at TAQAT Academy — scored 99.6%.</tspan></text>
    <g class="chip"><rect x="30" y="196" width="72" height="26" rx="13"/><text x="66" y="213.5" text-anchor="middle">Django</text></g><g class="chip"><rect x="110" y="196" width="72" height="26" rx="13"/><text x="146" y="213.5" text-anchor="middle">Python</text></g><g class="chip"><rect x="190" y="196" width="56" height="26" rx="13"/><text x="218" y="213.5" text-anchor="middle">REST</text></g><g class="chip"><rect x="254" y="196" width="41" height="26" rx="13"/><text x="274.5" y="213.5" text-anchor="middle">AI</text></g>
  </g>
  
</g>
<rect x=".5" y=".5" width="419" height="249" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
